<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- ============================== -->
    <!-- META CONFIGURACION -->
    <!-- ============================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ============================== -->
    <!-- TITULO DE LA APLICACION -->
    <!-- ============================== -->
    <title>SIVACAD | ISC | TESI</title>

    <!-- ============================== -->
    <!-- FAVICON -->
    <!-- ============================== -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- ============================== -->
    <!-- PWA -->
    <!-- ============================== -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#003d99" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ============================== -->
    <!-- MODO OSCURO + ERROR SUPPRESSION -->
    <!-- ============================== -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sivacad_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var _origSetTimeout = window.setTimeout;
          window.setTimeout = function (fn, ms) {
            if (typeof fn === 'function') {
              var wrapped = function () {
                try { return fn.apply(this, arguments); }
                catch (e) {
                  if (e && e.message && e.message.indexOf('startTime') !== -1) return;
                  throw e;
                }
              };
              return _origSetTimeout.call(window, wrapped, ms);
            }
            return _origSetTimeout.call(window, fn, ms);
          };
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- ============================== -->
    <!-- ROOT DE REACT -->
    <!-- ============================== -->
    <div id="root"></div>

    <!-- ============================== -->
    <!-- SCRIPT PRINCIPAL (VITE / REACT) -->
    <!-- ============================== -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
